name: "Copilot Setup Steps"

# Validates the file when changed + allows manual runs from the Actions tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name MUST be exactly `copilot-setup-steps`
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read   # Required if you check out the repo yourself

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # or "3.12", "3.11", etc.
          cache: "pip"             # caches pip dependencies (uses requirements.txt / pyproject.toml)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Choose one of the following (or adapt to your project):
          pip install -r requirements.txt
          # or
          # pip install -e ".[dev]"
          # or (if using Poetry)
          # pip install poetry && poetry install
          # or (if using uv – faster)
          # pip install uv && uv sync
